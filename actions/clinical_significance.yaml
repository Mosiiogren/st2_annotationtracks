---
name: clinical_significance
enabled: True
description: Retrieve and filter clinical significance data
runner_type: python-script
entry_point: clinical_significance.py
parameters:
  clinicalsignificancefileurl:
    type: array
    description: Link to the clinical significance data at dbVar, information seen at https://ftp.ncbi.nlm.nih.gov/pub/dbVar/data/README.txt
    default: ["https://ftp.ncbi.nlm.nih.gov/pub/dbVar/data/Homo_sapiens/by_assembly/GRCh38/gvf/GRCh38.variant_call.clinical.benign_or_likely_benign.gvf.gz","https://ftp.ncbi.nlm.nih.gov/pub/dbVar/data/Homo_sapiens/by_assembly/GRCh38/gvf/GRCh38.variant_call.clinical.conflicting_or_other.gvf.gz","https://ftp.ncbi.nlm.nih.gov/pub/dbVar/data/Homo_sapiens/by_assembly/GRCh38/gvf/GRCh38.variant_call.clinical.pathogenic_or_likely_pathogenic.gvf.gz","https://ftp.ncbi.nlm.nih.gov/pub/dbVar/data/Homo_sapiens/by_assembly/GRCh38/gvf/GRCh38.variant_call.clinical.uncertain_significance.gvf.gz"]
    position: 0
  outputclinicalsignificance:
    type: string
    description: Path 
    default: "/storage/annotationtracks/"
    immutable: True
    position: 1
  columns:
    type: array
    description: List of columns
    default: ["chromosome","col2","Name","start","end","col6","col7","col8","col9"]
    position: 2
  attributes:
    type: array
    description: List of attributes
    default: ["Start_range","End_range","Dbxref","copy_number","phenotype","phenotype_id","zygosity","consequence","validated","clinical_int"]
    position: 3