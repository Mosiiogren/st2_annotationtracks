---
name: dosage_sensitivity
enabled: True
description: Retrieve and filter dosage sensitivity data
runner_type: python-script
entry_point: dosage_sensitivity.py
parameters:
  url:
    type: string
    description: Link to the dosage sensitivity at ClinGen, information seen at https://ftp.clinicalgenome.org/README
    default: "https://ftp.clinicalgenome.org/ClinGen_gene_curation_list_GRCh38.tsv"
    position: 0
  outputfolder:
    type: string
    description: Path 
    default: "/storage/annotationtracks/"
    immutable: True
    position: 1
  filename:
    type: string
    description: Path 
    default: "DosageSensitivity.tsv"
    immutable: True
    position: 2
  
