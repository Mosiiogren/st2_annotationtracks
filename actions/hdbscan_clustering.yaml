---
name: hdbscan_clustering
enabled: True
description: Cluster the given variants based on similarity and functions
runner_type: python-script
entry_point: hdbscan_clustering.py
parameters:
  variantfile:
    type: string
    description: CSV file containing variant data
    default: "/storage/refrencedata/sv_variants.csv"
    position: 0
  genedata:
    type: string
    description: Path to the stored gene data
    default: "{{ config_context.outputfilegene }}"
    immutable: True
    position: 1
  regulatorydata:
    type: string
    description: Path to where the regulatory data has been stored
    default: "{{ config_context.outputfileregulatory }}"
    immutable: True
    position: 2
  exondata:
    type: string
    description: Path to where the exon data has been stored
    default: "{{ config_context.outputfileexon }}"
    immutable: True
    position: 3
  outputfileclusters:
    type: string
    description: Path to where the clusters should be stored
    default: "/storage/annotationtracks/hdbscanclustering.json"
    immutable: True
    position: 4
  outputfilefigure:
    type: string
    description: Path to where the clusters should be stored
    default: "/storage/annotationtracks/density_score.svg"
    immutable: True
    position: 5
  outputfolder:
    type: string
    description: Path to where the annotationtracks should be stored
    default: "{{ config_context.outputfolderannotationtracks }}"
    immutable: True
    position: 6
  
