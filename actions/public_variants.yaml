---
name: public_variants
enabled: True
description: Public SV variants from dbVar
runner_type: python-script
entry_point: public_variants.py
parameters:
  urls:
    type: array
    description: Link to the SVs at dbVar, information seen at https://ftp.ncbi.nlm.nih.gov/pub/dbVar/sandbox/annotation/GRCh38/README
    default: ["https://ftp.ncbi.nlm.nih.gov/pub/dbVar/sandbox/annotation/GRCh38/GRCh38.nr_insertions.common.bed.gz","https://ftp.ncbi.nlm.nih.gov/pub/dbVar/sandbox/annotation/GRCh38/GRCh38.nr_deletions.common.bed.gz","https://ftp.ncbi.nlm.nih.gov/pub/dbVar/sandbox/annotation/GRCh38/GRCh38.nr_deletions.pathogenic.bed.gz","https://ftp.ncbi.nlm.nih.gov/pub/dbVar/sandbox/annotation/GRCh38/GRCh38.nr_duplications.common.bed.gz","https://ftp.ncbi.nlm.nih.gov/pub/dbVar/sandbox/annotation/GRCh38/GRCh38.nr_duplications.pathogenic.bed.gz","https://ftp.ncbi.nlm.nih.gov/pub/dbVar/sandbox/annotation/GRCh38/GRCh38.nr_insertions.pathogenic.bed.gz"]
    position: 0
  outputfolder:
    type: string
    description: Path 
    default: "{{ config_context.outputfolderannotationtracks }}"
    immutable: True
    position: 1
  columns:
    type: array
    description: List of columns in the dataframe
    default: ["chromosome","start", "end", "info"]
    immutable: True
    position: 2
  filename:
    type: string
    description: Path 
    default: "Public_SV"
    immutable: True
    position: 3