---
name: regulatory_data
enabled: True
description: Retrieve and filter regulatory data
runner_type: python-script
entry_point: regulatory_data.py
parameters:
  regulatoryfileurl:
    type: array
    description: Link to the regulatory data at Ensemble, information seen at https://ftp.ensembl.org/pub/release-116/regulation/README.md
    default: [https://ftp.ensembl.org/pub/release-116/regulation/homo_sapiens/GRCh38/annotation/Homo_sapiens.GRCh38.EMARs.v116.gff.gz,"https://ftp.ensembl.org/pub/release-116/regulation/homo_sapiens/GRCh38/annotation/Homo_sapiens.GRCh38.regulatory_features.v116.gff3.gz"]
    position: 0
  outputfileregulatory:
    type: string
    description: Path to where the filtered regulatory data should be stored
    default: "{{ config_context.outputfileregulatory }}"
    immutable: True
    position: 1
  outputfoldertracks:
    type: string
    description: Path to where the filtered regulatory data should be stored
    default: "{{ config_context.outputfolderannotationtracks }}"
    immutable: True
    position: 2
  columns:
    type: array
    description: List of columns in the dataframe
    default: ["chromosome","source","Type","start","end","col6","col7","col8","col9"]
    position: 3
  attributes:
    type: array
    description: List of attributes
    default: ["ID","extended_start","extended_end","gene_id","gene_name","gene_biotype"]
    position: 4
  filename:
    type: string
    description: Filename
    default: "regulatorydata.tsv"
    immutable: True
    position: 5


    
