---
name: update_structuralvariant_tracks_gens
pack: st2_annotationtracks
description: Workflow to create and update structural variant annotationtracks in Gens
runner_type: orquesta
entry_point: workflows/update_structuralvariant_tracks_gens.yaml
enabled: true


parameters:
  hosts:
    description: The server the command is running at
    type: string
    default: "{{ config_context.hosts }}"
    immutable: True
  cwd:
    description: Path to the folder containing the docker-compose file
    type: string
    default: "{{ config_context.cwd }}"
    immutable: True
  variantfilename:
    description: The filepath to the file containing the variants
    type: string
    default: "data/dumps/cancer_sv_variants.json"
  

  
  
