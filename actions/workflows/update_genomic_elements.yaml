---
version: 1.0
name: update_genomic_elements
description: Workflow to create regulatory elements files for clustering and create annotationtracks for Gens


input:
  - hosts
  - cwd
  - regulatoryfileurl
  - MANEfileurl
  - genefileurl


vars:
 - msg:
 - annnotationtracks:


tasks:
  get_regulatory_data:
    action: Annotationtracks.regulatory_data
    input:
      regulatoryfileurl: <% ctx().regulatoryfileurl %>
    next:
      - when: "{{ succeeded() }}"
        publish:
          - annnotationtracks: <% result().result %>
        do:
          - get_gene_data

  get_gene_data:
    action: Annotationtracks.gene_data
    input:
      MANEfileurl: <% ctx().MANEfileurl %>
      genefileurl: <% ctx().genefileurl %>
    next:
      - when: "{{ succeeded() }}"
        publish:
          - annnotationtracks: <% ctx().annnotationtracks + result().result %>
        do:
          - upload_into_gens

  upload_into_gens:
    action: Annotationtracks.upload_tracks_to_gens
    input:
      annnotationtracks: <% ctx().annnotationtracks %>
      timeout: 10000
    next:
      - when: "{{ succeeded() }}"
        publish:
          - msg: "Annotationtracks has been copied and uploaded to Gens"
        