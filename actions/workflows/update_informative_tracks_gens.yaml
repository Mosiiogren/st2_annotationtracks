---
version: 1.0
name: update_informative_tracks_gens
description: Workflow to create informative (phenotype, dosage sensitivity ...) annotationtracks and update the existing annotationtracks in Gens

input:
  - hosts
  - cwd

vars:
 - msg:
 - annnotationtracks:


tasks:
  get_phenotype_data:
    action: st2_annotationtracks.clinical_significance
    next:
      - when: "{{ succeeded() }}"
        publish:
          - annnotationtracks: <% result().result %>
        do:
          - get_dosage_sensitivity
  
  get_dosage_sensitivity:
    action: st2_annotationtracks.dosage_sensitivity
    next:
      - when: "{{ succeeded() }}"
        publish:
          - annnotationtracks: <% ctx().annnotationtracks + result().result %>
        do:
          - copy_into_gens_container
    
  copy_into_gens_container:
    action: st2_annotationtracks.upload_tracks_to_gens
    input:
      annnotationtracks: <% ctx().annnotationtracks %>
    next:
      - when: "{{ succeeded() }}"
        publish:
          - msg: "Annotationtracks has been copied into the Gens container"
        do:
          - upload_into_gens

  upload_into_gens:
    action: st2_annotationtracks.gens_update
    input:
      annnotationtracks: <% ctx().annnotationtracks %>
    next:
      - when: "{{ succeeded() }}"
        publish:
          - msg: <% result().get(ctx().hosts).stderr %>




