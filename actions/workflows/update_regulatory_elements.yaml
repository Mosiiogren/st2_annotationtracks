---
version: 1.0
name: update_regulatory_elements
description: Workflow to create regulatory elements files for clustering and create annotationtracks for Gens


input:
  - hosts
  - cwd
  - regulatoryfileurl
  - MANEfileurl
  - genefileurl


vars:
 - msg:
 - annnotationtracks:


tasks:
  get_regulatory_data:
    action: st2_annotationtracks.regulatory_data
    input:
      regulatoryfileurl: <% ctx().regulatoryfileurl %>
    next:
      - when: "{{ succeeded() }}"
        publish:
          - annnotationtracks: <% result().result %>
        do:
          - get_gene_data

  get_gene_data:
    action: st2_annotationtracks.gene_data
    input:
      MANEfileurl: <% ctx().MANEfileurl %>
      genefileurl: <% ctx().genefileurl %>
    next:
      - when: "{{ succeeded() }}"
        publish:
          - msg: <% result().stdout %>
        do:
          - copy_into_gens_container

  copy_into_gens_container:
    action: st2_annotationtracks.upload_tracks_to_gens
    input:
      annnotationtracks: <% ctx().annnotationtracks %>
    next:
      - when: "{{ succeeded() }}"
        publish:
          - msg: "Annotationtracks has been copied into the Gens container"
        do:
          - upload_into_gens

  upload_into_gens:
    action: st2_annotationtracks.gens_update
    input:
      annnotationtracks: <% ctx().annnotationtracks %>
      timeout: 500
    next:
      - when: "{{ succeeded() }}"
        publish:
          - msg: <% result().get(ctx().hosts).stderr %>