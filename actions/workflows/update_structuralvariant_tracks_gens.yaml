---
version: 1.0
name: update_structuralvariant_tracks_gens
description: Workflow to create annotationtracks and update the annotationtracks in Gens


input:
  - hosts
  - cwd
  - variantfile


vars:
 - msg:
 - annnotationtracks:


tasks: 
  make_clustering:
    action: annotationtracks.manual_clustering
    input:
      variantfile: <% ctx().variantfile %>
      timeout: 10000000
    next:
      - when: "{{ succeeded() }}"
        publish:
          - msg: <% result().stdout %>
        do:
          - make_annotationtracks
      - when: "{{ failed() }}"
        publish:
          - msg: <% result().stderr %>
        do:
          - report_failure

  make_annotationtracks:
    action: annotationtracks.annotationtracks
    next:
      - when: "{{ succeeded() }}"
        publish:
          - annnotationtracks: <% result().result %>
        do:
         - upload_into_gens
      - when: "{{ failed() }}"
        publish:
          - msg: <% result().stderr %>
        do:
          - report_failure
        
  upload_into_gens:
    action: annotationtracks.upload_tracks_to_gens
    input:
      annnotationtracks: <% ctx().annnotationtracks %>
      timeout: 100000
    next:
      - when: "{{ succeeded() }}"
        publish:
          - msg: "Annotationtracks has been copied and uploaded to Gens"
        do:
          - report_finished
      - when: "{{ failed() }}"
        publish:
          - msg: <% result().get(ctx().hosts).stderr %>
        do:
          - report_failure
  
  report_finished:
    action: core.inject_trigger
    input:
      trigger_name: gmc_norr_analysis.email_notification
      payload:
        subject: >
          Finished loading annotationtracks to Gens
        message: <% ctx().msg %>
    

  report_failure:
    action: core.inject_trigger
    input:
      trigger_name: gmc_norr_analysis.email_notification
      payload:
        subject: >
          Failed to update annotationtracks in Gens
        message: <% ctx().msg %>
    next:
      - when: "{{ succeeded() }}"
        do: fail
    
    